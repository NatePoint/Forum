<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Trap — новый проект</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="logo">
      <span class="logo-mark">FT</span>
      <span class="logo-text">Focus Trap</span>
    </a>
    <nav class="main-nav">
      <a href="#about" class="nav-link active">Главная</a>
      <a href="#features" class="nav-link">Возможности</a>
      <a href="#contact" class="nav-link">Контакты</a>
    </nav>
    <button type="button" class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="mobile-nav" id="mobileNav">
    <a href="#about" class="nav-link">Главная</a>
    <a href="#features" class="nav-link">Возможности</a>
    <a href="#contact" class="nav-link">Контакты</a>
  </nav>
</header>

<main>
  <section class="hero" id="about">
    <h1>Focus Trap</h1>
    <p class="hero-sub">Стартовая страница нового проекта. Шапка готова, дальше — больше.</p>
    <a href="#features" class="btn-primary">Смотреть разделы</a>
  </section>

  <section class="placeholder" id="features">
    <h2>Разделы появятся позже</h2>
    <p>Это заглушка под будущий контент проекта.</p>
  </section>
</main>

<footer class="site-footer" id="contact">
  <p>Focus Trap, 2026</p>
</footer>

<script>
const burger = document.getElementById('burger');
const mobileNav = document.getElementById('mobileNav');

burger.addEventListener('click', () => {
  const isOpen = mobileNav.classList.toggle('open');
  burger.classList.toggle('open', isOpen);
  burger.setAttribute('aria-expanded', String(isOpen));
});

document.querySelectorAll('.mobile-nav .nav-link').forEach((link) => {
  link.addEventListener('click', () => {
    mobileNav.classList.remove('open');
    burger.classList.remove('open');
    burger.setAttribute('aria-expanded', 'false');
  });
});
</script>

</body>
</html>
